name: "gluino_rpv_onshell_squark"
description: "RPV gluino via on-shell squark: go > u ul, ul > d s"

collider:
  beam1_pdg: 2212
  beam2_pdg: 2212
  energy_beam1: 6800.0
  energy_beam2: 6800.0

process:
  model: "RPVMSSM_UFO"
  # Use (go > u d s) decay chain with ul kept in diagrams (on-shell at 800 GeV).
  # All OTHER squarks excluded to keep diagram count manageable.
  process_string: "p p > go go"
  decay_chain: "(go > u d s)"
  extra_partons: 1
  excluded_particles:
    # Exclude all squarks EXCEPT ul (1000002) which we want on-shell
    - "ur"
    - "dl"
    - "dr"
    - "cl"
    - "cr"
    - "sl"
    - "sr"
    - "b1"
    - "b2"
    - "t1"
    - "t2"

particles:
  - pdg_id: 1000021
    name: "gluino"
    mass: 1000.0
    width: null
  - pdg_id: 1000002
    name: "ul"  # up-squark-left
    mass: 800.0  # configurable squark mass
    width: null

# Custom decays for on-shell squark topology
# Color/charge conservation: go (color 8) -> u (color 3) + ul~ (color 3bar)
# Then ul~ (anti-squark) -> dbar + sbar via RPV, or we define ul -> d + s and MG conjugates
decays:
  - pdg_id: 1000021  # gluino (Majorana fermion)
    width: 1.0
    channels:
      - br: 0.5
        products: [2, -1000002]  # u + ul~ (u-quark + anti-up-squark)
      - br: 0.5
        products: [-2, 1000002]  # ubar + ul (anti-u + up-squark)
  - pdg_id: 1000002  # up-squark-left (ul -> d s via RPV lambda'')
    width: 1.0
    channels:
      - br: 1.0
        products: [1, 3]  # d + s

matching:
  enabled: false

generation:
  num_events: 100
  random_seed: 12345

jets:
  algorithm: "antikt"
  radius: 0.4
  pt_min: 25.0
  eta_max: 2.5

output:
  save_hdf5: true
  compression: "gzip"
  max_jets_per_event: 20
  max_particles_per_jet: 100
