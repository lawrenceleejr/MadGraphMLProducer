name: "gluino_rpv_onshell_squark"
description: "RPV gluino via on-shell squark: go > u ul, ul > d s"

collider:
  beam1_pdg: 2212
  beam2_pdg: 2212
  energy_beam1: 6800.0
  energy_beam2: 6800.0

process:
  model: "RPVMSSM_UFO"
  # Explicitly list the on-shell ul~ intermediate in the decay chain so MadGraph
  # uses the decay-chain formalism (narrow width approximation) rather than
  # computing the full 3-body amplitude go > u d s. Writing "(go > u d s)"
  # causes MadGraph to ignore the on-shell squark. We use the anti-squark (ul~)
  # because the RPV vertex has ul (Q=+2/3) -> d~ s~, so its charge conjugate
  # is ul~ (Q=-2/3) -> d s. The UFO vertex is defined for go-u-ul~ fermion
  # flow; go > u~ ul (the other Majorana channel) fails at WEIGHTED=1.
  # ul is intentionally NOT excluded here so it can appear in the decay chain.
  # NOTE: extra_partons=0 because on-shell squark + extra parton causes
  # MadGraph colorflow errors with the RPV epsilon tensor vertex.
  process_string: "p p > go go"
  decay_chain: "(go > u ul~, ul~ > d s)"
  extra_partons: 0
  excluded_particles:
    # Exclude all squarks from production diagrams except ul (used in decay)
    - "ur"
    - "dl"
    - "dr"
    - "cl"
    - "cr"
    - "sl"
    - "sr"
    - "b1"
    - "b2"
    - "t1"
    - "t2"

particles:
  - pdg_id: 1000021
    name: "gluino"
    mass: 1000.0
    width: null
  - pdg_id: 1000002
    name: "ul"  # up-squark-left
    mass: 800.0  # configurable squark mass
    width: null

# Custom decays for on-shell squark topology
# Charge conservation checks:
#   go (Q=0) -> u (Q=+2/3) + ul~ (Q=-2/3)  ✓
#   go (Q=0) -> u~ (Q=-2/3) + ul (Q=+2/3)  ✓ (Majorana conjugate)
#   ul (Q=+2/3) -> d~ (Q=+1/3) + s~ (Q=+1/3)  ✓  (SLHA block for particle)
#   ul~ (Q=-2/3) -> d (Q=-1/3) + s (Q=-1/3)  ✓  (MadGraph charge-conjugate)
# MadGraph uses the ul DECAY block to determine the width, and infers
# ul~ -> d s as the charge conjugate for use in the process string.
decays:
  - pdg_id: 1000021  # gluino (Majorana fermion)
    width: 1.0
    channels:
      - br: 0.5
        products: [2, -1000002]  # u + ul~ (u-quark + anti-up-squark)
      - br: 0.5
        products: [-2, 1000002]  # u~ + ul (anti-u-quark + up-squark)
  - pdg_id: 1000002  # up-squark-left: ul -> d~ s~ via RPV lambda'' (charge-conserving)
    width: 1.0
    channels:
      - br: 1.0
        products: [-1, -3]  # d~ + s~ (MG conjugate gives ul~ -> d s)

matching:
  enabled: false

generation:
  num_events: 100
  random_seed: 12345

jets:
  algorithm: "antikt"
  radius: 0.4
  pt_min: 1.0      # Low cut to keep all partons
  eta_max: 10.0    # High cut to keep all partons

output:
  save_hdf5: true
  compression: "gzip"
  max_jets_per_event: 20
  max_particles_per_jet: 100
