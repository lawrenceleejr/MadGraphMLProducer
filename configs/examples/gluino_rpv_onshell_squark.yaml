name: "gluino_rpv_onshell_squark"
description: "RPV gluino via on-shell squark: go > u ur~, ur~ > d s"

collider:
  beam1_pdg: 2212
  beam2_pdg: 2212
  energy_beam1: 6800.0
  energy_beam2: 6800.0

process:
  model: "RPVMSSM_UFO"
  # RPVMSSM_UFO (af1_ufo) uses non-standard squark names su1..su6/sd1..sd6,
  # but MadGraph resolves particles in process strings by PDG code alias, NOT
  # by the model's internal names. Use standard MG5 MSSM aliases in the
  # process string (ul/ur/dl/dr etc.), which map to PDG codes regardless of
  # what the UFO model calls them:
  #
  #   ul  = PDG  1000002 = su1 in this model (couples to t quark via gluino!)
  #   ur  = PDG  2000002 = su4 in this model (couples to u quark via gluino) ← want this
  #   cl  = PDG  1000004 = su2    cr  = PDG  2000004 = su5
  #   t1  = PDG  1000006 = su3    t2  = PDG  2000006 = su6
  #   dl  = PDG  1000001 = sd1    dr  = PDG  2000001 = sd4
  #   sl  = PDG  1000003 = sd2    sr  = PDG  2000003 = sd5
  #   b1  = PDG  1000005 = sd3    b2  = PDG  2000005 = sd6
  #
  # Only ur (PDG 2000002 = su4) has BOTH the go-u-ur~ QCD vertex (WEIGHTED=1)
  # AND the RPV vertex ur~+d~+s~ (WEIGHTED=1, coupling LUDD1x1x2=0.2 default).
  # Note: using the model name su4~/su4 directly fails with "No particle su4~
  # in model" because MadGraph cannot look up model-specific names by alias.
  #
  # Charge conservation:
  #   go (Q=0) -> u (Q=+2/3) + ur~ (Q=-2/3)  ✓
  #   ur~ (Q=-2/3) -> d (Q=-1/3) + s (Q=-1/3)  ✓
  # SLHA DECAY for ur (Q=+2/3) -> d~ (Q=+1/3) + s~ (Q=+1/3), ΔQ=0 ✓
  # MadGraph infers ur~ -> d + s as the charge conjugate.
  #
  # NOTE: extra_partons=0 because on-shell squark + extra parton causes
  # MadGraph colorflow errors with the RPV epsilon tensor vertex.
  process_string: "p p > go go"
  decay_chain: "(go > u ur~, ur~ > d s)"
  extra_partons: 0
  excluded_particles:
    # Exclude all squarks from production except ur (PDG 2000002, used in decay).
    # Using standard MG5 MSSM aliases (ul/cl/t1/cr/t2/dl/sl/b1/dr/sr/b2).
    - "ul"   # PDG 1000002 = su1: couples to t quark in this model — exclude
    - "cl"   # PDG 1000004 = su2
    - "t1"   # PDG 1000006 = su3
    # ur (PDG 2000002 = su4) intentionally omitted: needed as on-shell intermediate
    - "cr"   # PDG 2000004 = su5
    - "t2"   # PDG 2000006 = su6
    - "dl"   # PDG 1000001 = sd1
    - "sl"   # PDG 1000003 = sd2
    - "b1"   # PDG 1000005 = sd3
    - "dr"   # PDG 2000001 = sd4
    - "sr"   # PDG 2000003 = sd5
    - "b2"   # PDG 2000005 = sd6

particles:
  - pdg_id: 1000021
    name: "gluino"
    mass: 1000.0
    width: null
  - pdg_id: 2000002   # ur in MG5 alias = su4 in RPVMSSM_UFO = up-quark-coupling squark
    name: "ur"
    mass: 800.0  # configurable squark mass
    width: null

# Custom decays for on-shell squark topology.
# SLHA DECAY blocks define particle decays; charge conjugate is inferred by MadGraph.
decays:
  - pdg_id: 1000021  # gluino (Majorana fermion)
    width: 1.0
    channels:
      - br: 0.5
        products: [2, -2000002]   # u + ur~  (up-quark + anti-up-squark-right)
      - br: 0.5
        products: [-2, 2000002]   # u~ + ur  (anti-up-quark + up-squark-right)
  - pdg_id: 2000002  # ur/su4: RPV decay ur -> d~ + s~ via lambda''_{112} (charge-conserving)
    width: 1.0
    channels:
      - br: 1.0
        products: [-1, -3]   # d~ + s~  (MG conjugate gives ur~ -> d + s)

matching:
  enabled: false

generation:
  num_events: 100
  random_seed: 12345

jets:
  algorithm: "antikt"
  radius: 0.4
  pt_min: 1.0      # Low cut to keep all partons
  eta_max: 10.0    # High cut to keep all partons

output:
  save_hdf5: true
  compression: "gzip"
  max_jets_per_event: 20
  max_particles_per_jet: 100
