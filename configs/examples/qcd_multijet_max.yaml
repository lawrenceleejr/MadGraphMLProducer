# ============================================================================
# Exclusive six-gluon production at LHC Run 3 (13.6 TeV)
# ============================================================================
#   g g > g g g g g g
#
# Maximum-multiplicity pure-QCD events: a gluon-gluon initial state producing
# exactly SIX gluons at the matrix-element level. Restricting to pure glue
# (gluon initial AND final state) makes this the single most tractable 2 -> 6
# QCD process -- ONE subprocess, no quark-flavor combinatorics -- while still
# carrying the full ~34,300-diagram, factorial cost of a 6-parton amplitude.
#
# "Exclusive": exactly 6 jets. No MLM matching, no extra partons -- the final
# state is a fixed 6-parton matrix element, not an inclusive >=6 sample.
#
# ----------------------------------------------------------------------------
# !! THIS IS EXPENSIVE !!  gg -> 6g has ~34,300 Feynman diagrams. Diagram
# generation, phase-space integration, and unweighting are all slow and
# RAM-hungry (expect hours and several GB). Start with a small `num_events`
# (or `-n`) for a first run, then scale up. Run parton-level for literally
# exactly-6-jet events:
#     ./run -c configs/examples/qcd_multijet_max.yaml -n 1000 --shower off
# ----------------------------------------------------------------------------

name: "qcd_multijet_max"
description: "Exclusive six-gluon production (gg -> 6g), maximum multiplicity, 13.6 TeV"

collider:
  beam1_pdg: 2212        # proton beams; the gg initial state is taken from the gluon PDF
  beam2_pdg: 2212
  energy_beam1: 6800.0   # sqrt(s) = 13.6 TeV
  energy_beam2: 6800.0

process:
  model: "sm"
  # Gluon initial state -> exactly six gluons. Pure QCD by construction
  # (gluons carry no electroweak charge), so no coupling-order constraint is
  # needed and there is a single partonic subprocess.
  process_string: "g g > g g g g g g"
  decay_chain: null
  extra_partons: 0        # EXCLUSIVE: fixed 6-parton ME, no matched extra jets
  excluded_particles: []

particles: []

matching:
  enabled: false          # exclusive: no MLM merging

generation:
  num_events: 1000        # keep modest; gg -> 6g is slow. Override with -n.
  random_seed: 12345
  # Generation-level cuts. BOTH are required for a finite cross section:
  ptj_min: 20.0           # regulates the SOFT singularity (every gluon pt>20)
  drjj_min: 0.4           # regulates the COLLINEAR singularity (R=0.4 separation)
  etaj_max: 5.0           # (output-level eta cut applied later in `jets`)
  use_syst: false         # avoid PDF downloads / Pythia incompatibility

jets:
  algorithm: "antikt"
  radius: 0.4
  pt_min: 20.0            # matches the ME ptj cut so all six gluons become jets
  eta_max: 4.5            # wide acceptance to retain forward jets

output:
  output_dir: "./output/qcd_multijet_max"
  filename_prefix: "qcd_multijet_max"
  save_lhe: true
  save_hepmc: true
  save_hdf5: true
  compression: "gzip"
  max_jets_per_event: 20      # room for the six hard jets (+ shower, if enabled)
  max_particles_per_jet: 100
